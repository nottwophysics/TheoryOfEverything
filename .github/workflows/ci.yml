# GitHub Actions CI (mirror of .forgejo/workflows/ci.yml for GitHub forks).
# Runs the test suite on every push and pull request across the supported
# Python versions, using the packaged install (`pip install -e .`, no PYTHONPATH).
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with test extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Verify import works without PYTHONPATH
        # Run from a directory that is NOT the repo root, proving the packaged
        # install (not the cwd) resolves the imports.
        run: |
          cd /tmp
          python -c "import constants, numerology, predictions, gravity, quantum; from constants.koide import KoideRelation; print('imports OK:', KoideRelation().q_value()['holds_to_1e-3'])"

      - name: Claims check (docs must agree with the code)
        # Guards the two failure modes this repository keeps hitting: a headline
        # number drifting across documents, and a retired claim surviving as a
        # paraphrase. Runs on one Python version -- it is a text check, not a
        # compatibility check.
        if: matrix.python-version == '3.13'
        run: python tools/check_claims.py

      - name: Run test suite
        run: |
          cd /tmp
          python -m pytest "$GITHUB_WORKSPACE/tests" -q
