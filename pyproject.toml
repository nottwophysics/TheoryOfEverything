[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "theory-of-everything"
version = "0.1.0"
description = "Computational framework bridging Advaita Vedanta and quantum mechanics"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "Development Status :: 3 - Alpha",
]
dependencies = [
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "scipy>=1.10.0",
]

[project.optional-dependencies]
test = ["pytest>=7.0.0"]
# PyPhi is GPLv3+ and is NOT installed by default: it is needed only to
# REGENERATE the canonical IIT Phi values behind §8. The committed analysis
# path (reproducibility/phi_s/reproduce.sh) runs on the frozen CSV and needs
# only numpy + scipy. Requires Python 3.9; see reproducibility/phi_s/README.md.
phi = ["pyphi==1.2.0"]

[project.scripts]
# `theory-of-everything` runs the full demonstration (formerly `python main.py`).
theory-of-everything = "main:main"

# The repository uses a flat layout with many top-level packages, so setuptools'
# automatic discovery is ambiguous; enumerate the importable packages explicitly
# and expose `main.py` as a top-level module. `tests`, build artefacts, and the
# analysis figures are intentionally excluded from the installed distribution.
[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = [
    "agents*", "philosophy*", "constants*", "emergence*", "falsification*",
    "gravity*", "numerology*", "particles*",
    "predictions*", "quantum*", "simulations*", "visualizations*",
]
exclude = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
